interface:
  display_name: "HZP Amazon 2-1｜产品市场分析"
  short_description: Analyze one Amazon US product ASIN from matching Keepa, Helium
    10 Cerebro, Amazon Reviews, sales-record/estimate, investment-return-image inputs,
    and a public Amazon product-page snapshot, then produce an evidence-grounded Chinese
    HTML decision report for product selection and product development. The report must
    use H10 bid data directly, distinguish recorded sales from modeled returns, quote
    short real reviews with Chinese translations, reconcile current page facts with
    historical and file evidence, emphasize Product Definition V1, distinguish facts/
    inference/supply-chain validation, and use QMT terminology only. Never invent
    missing metrics or merge reviews.
