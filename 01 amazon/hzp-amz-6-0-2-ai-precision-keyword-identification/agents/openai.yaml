interface:
  display_name: "HZP Amazon 6-0-2｜AI精准关键词识别"
  short_description: "按唯一Keyword调用Precision Brain并输出可追溯的A/B/C/D/E五类资产"
  brand_color: "#2563EB"
  default_prompt: "Use $hzp-amz-6-0-2-ai-precision-keyword-identification and execute references/precision-judgment-kernel.md. Read the shared precision-filter configuration at 01_公共资料/03_系统配置/生成精准词库的要求.txt (normalize 已精准 to 精准) before deriving B/C/D/E, then read the complete current-product text at 05_分析源数据/01_产品数据/本产品/产品识别 - 文本文案.txt and the newest exact 6-0-1 file 06_SKILL分析报告/6-0-1_对标自然排名关键词提取/data/6-0-1_所有对标自然排名关键词_YYYYMMDD_HHMMSS.csv by filename timestamp. Validate the header only; do not require RunPackage, manifest, sidecar or filesystem mtime. For the current Product Ground Truth, identify one PrimaryPurchaseDriver per Run (FUNCTIONAL, COMPATIBILITY, GIFT_EMOTIONAL, AESTHETIC_DECOR, OCCASION or HYBRID). For every canonical Keyword, reconstruct Amazon Searcher Intent, use the Driver-specific evidence (Gift Mission/Recipient/Relationship/Occasion for GIFT_EMOTIONAL), distinguish CORE FIT from CAN SERVE, check every Hard Modifier, run Decision Challenge, and judge precision once using the unchanged four-level kernel, then apply the same decision to all Benchmark × Keyword observation rows. Write A 6-0-2_精准判断所有词表, B 6-0-2_筛选后的对标精准词, C 6-0-2_去重_筛选后的对标精准词, D 6-0-2_去对标去重_筛选后的精准词, and E per-Benchmark 6-0-2_{所属产品编号}_筛选后的精准词 files. Keep source IDs unchanged and preserve the existing output schemas and validate all five asset classes, including config lineage and zero additional AI calls for B/C/D/E. Never query or write ERP/Amazon."

policy:
  allow_implicit_invocation: true



