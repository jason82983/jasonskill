interface:
  display_name: "HZP Amazon 6-0-2｜AI精准关键词识别"
  short_description: "按唯一Keyword判断并输出3+N表Run Package"
  brand_color: "#2563EB"
  default_prompt: "Use $hzp-amz-6-0-2-ai-precision-keyword-identification and execute references/precision-judgment-kernel.md. Read the complete current-product text at 05_分析源数据/01_产品数据/本产品/产品识别 - 文本文案.txt and the latest VALID 6-0-1 BENCHMARK_KEYWORD_ALL_OBSERVATIONS Run Package. For every canonical Keyword, reconstruct Amazon Searcher Intent, distinguish CORE FIT from CAN SERVE, check every Hard Modifier, and judge precision once using the unchanged four-level kernel, then apply the same decision to all Benchmark × Keyword observation rows. Write A 6-0-2_精准判断所有词表, B 6-0-2_高度精准词表 (strict filter from A), C 6-0-2_去对标去重 高度精准词 (one row per canonical keyword derived from B, without benchmark identity), and one D 6-0-2_{所属产品编号}_高度精准词 per source product number filtered from B. Keep source IDs unchanged. Write all timestamp-matched CSVs directly in the fixed 6-0-2_AI精准关键词识别 report root, with run_manifest_{RUN_TIMESTAMP}.json binding the package. Validate schemas, observation coverage, consistent keyword judgments, exact B filter, C uniqueness, D membership/uniqueness/coverage, expected N D files and timestamp/package consistency before marking VALID. Record 601 input lineage and input counts. Preserve prior timestamped files. Never query or write ERP/Amazon."

policy:
  allow_implicit_invocation: true
