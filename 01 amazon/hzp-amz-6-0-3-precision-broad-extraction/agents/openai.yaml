interface:
  display_name: "HZP Amazon 6-0-3｜精准泛词提取"
  short_description: "从6-0-2去对标去重高精准词提取精准泛词"
  default_prompt: "Use $hzp-amz-6-0-3-precision-broad-extraction. Resolve the latest complete VALID 6-0-2 Run Package by RUN_TIMESTAMP and manifest with resolve_latest_valid_602_run_package(product_root, product_code); validate all three shared CSVs and every expected per-benchmark D CSV, but use only C `6-0-2_去对标去重 高度精准词_{RUN_TIMESTAMP}.csv` (Report_Identity `去对标去重 高度精准词`, Report_Key `UNIQUE_HIGH_PRECISION_KEYWORDS`) as Intent input. Never use A `精准判断所有词表`, B `高度精准词表` or D per-benchmark tables as Intent inputs. Validate every C row is 高度精准 and normalized canonical keywords are unique; reject violations with 603_INPUT_NOT_ALL_HIGH_PRECISION or 603_INPUT_DUPLICATE_KEYWORD. Record the 602 Run ID, timestamp, folder, C file and input/unique count in lineage. Semantically map each Id-preserved keyword to one canonical primary intent and at most one direct parent, preserving independently operable purchase dimensions and avoiding fragmentation. Pass through 竞争产品数 and 供需比 unchanged as keyword-level evidence. Produce the same nine-column mapping CSV and nine-column intent summary CSV. The program calculates levels, direct and recursive volumes, unique-source-record subtree average competitor count and aggregate-volume/average-count ratio; never sum competitor counts, average keyword ratios, use weighted averages, or average child averages. Run Coverage, pass-through, subtree metric, parent existence, cycle, root consistency and CSV readback integrity checks; do not rejudge precision or execute ad/ERP writes."

policy:
  allow_implicit_invocation: true
